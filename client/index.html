<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F4D45" />
    <meta
      name="description"
      content="Nurture keeps your family's caregiving in one place: medications, appointments, documents, costs, and updates."
    />
    <title>Nurture</title>
    <script>
      // Apply the saved theme before first paint. Keep the key in sync with src/app/theme.ts.
      try {
        const theme = localStorage.getItem('nurture.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {
        // Storage is unavailable; follow the system theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
