name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nurture-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nurture
          POSTGRES_PASSWORD: nurture
          POSTGRES_DB: nurture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nurture -d nurture_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: nurture
      PGPASSWORD: nurture
      # Each suite resets its own database, and some insist on a specific name.
      TEST_DATABASE_URL: postgres://nurture:nurture@localhost:5432/nurture_test
      MEDICATION_TEST_DATABASE_URL: postgres://nurture:nurture@localhost:5432/nurture_medications_test
      APPOINTMENT_TEST_DATABASE_URL: postgres://nurture:nurture@localhost:5432/nurture_appointments_test
      EXPENSE_TEST_DATABASE_URL: postgres://nurture:nurture@localhost:5432/nurture_expenses_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nurture-api/package-lock.json
      - run: npm ci
      - name: Create the per-suite test databases
        run: |
          createdb nurture_medications_test
          createdb nurture_appointments_test
          createdb nurture_expenses_test
      - name: API tests (rebuilds nurture_test from the migrations)
        run: npm test
      - name: Medication tests
        run: npm run test:medications
      - name: Appointment tests
        run: node --test tests/appointments/appointments.integration.test.cjs
      - name: Expense tests
        run: node --test tests/expenses/expenses.integration.test.cjs
